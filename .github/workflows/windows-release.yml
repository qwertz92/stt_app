---
name: Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      # One native command per step, deliberately. GitHub runs a pwsh step as
      # `pwsh -command ". '<file>'"` with `$ErrorActionPreference = 'stop'`
      # prepended and `exit $LASTEXITCODE` appended -- and that preference governs
      # *cmdlet* errors only. A native command's non-zero exit throws nothing
      # unless $PSNativeCommandUseErrorActionPreference is $true, which defaults to
      # $false (measured on pwsh 7.6.5). So in a multi-command block only the LAST
      # command decides the step and every failure above it is discarded: ruff and
      # pytest could both fail while this job stayed green and published the
      # release. Split steps make each exit code the step's own, which is the shape
      # quality.yml already uses.
      - name: Install locked Python dependencies
        shell: pwsh
        run: uv sync --group dev --locked

      - name: Install locked JavaScript dependencies
        shell: pwsh
        run: npm ci --omit=dev

      - name: Run release quality gates
        shell: pwsh
        # offscreen is set here on purpose, and the pixel-exact layout tests
        # skip themselves under it (see tests/conftest.py). Those tests
        # compare widget geometry to the pixel, and offscreen reports metrics
        # 1-4 px off, so under offscreen they fail for reasons that have
        # nothing to do with the code. That is what stopped v0.8.0 from ever
        # being published: the tag exists, the release does not, because this
        # gate runs before the build step and failed on an artifact.
        #
        # A release gate has to be deterministic, so it runs in the one Qt
        # environment that is guaranteed to exist on any runner. The skipped
        # tests are not unverified: scripts/create_release.py runs the whole
        # suite on a real platform plugin before the tag is ever created, and
        # quality.yml runs it without offscreen on every push and PR.
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --no-sync ruff check .

      - name: Run the release test suite
        shell: pwsh
        # offscreen for the same reason as the gate above.
        # No -q: pyproject already sets addopts = "-q", and a second
        # one is -qq, which suppresses the final "N passed" line, so the
        # release log could not show how many tests the gate actually ran.
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --no-sync pytest

      - name: Audit locked production JavaScript dependencies
        shell: pwsh
        run: npm audit --omit=dev --package-lock-only --audit-level=moderate

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Verify release tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        # The tag reaches the script through the environment, never through
        # ${{ }}: that is textual substitution into the generated PowerShell
        # file, and a ref name may legally contain a quote, a dollar and a
        # backtick -- git check-ref-format accepts one -- so an interpolated
        # tag is executable source in a job holding contents: write.
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python .\scripts\release_version.py verify $env:RELEASE_TAG --against-git-tags

      - name: Build portable Windows bundle
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\build_windows_release.ps1

      - name: Build Windows installer
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\build_windows_installer.ps1 -SkipBundleBuild

      - name: Create installer checksum
        shell: pwsh
        run: |
          $installer = "release\installer\stt_app-win-x64-setup.exe"
          $checksum = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          "$checksum  stt_app-win-x64-setup.exe" |
              Set-Content -Encoding ASCII "$installer.sha256"

      - name: Upload manual workflow artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: stt_app-windows-release
          if-no-files-found: error
          retention-days: 3
          # The portable bundle is only uploaded zipped; adding the unpacked
          # folder as well doubled the artifact size and burned the free
          # Actions storage quota (GB-months) for no benefit.
          path: |
            release/stt_app-win-x64.zip
            release/installer/stt_app-win-x64-setup.exe
            release/installer/stt_app-win-x64-setup.exe.sha256

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        # RELEASE_TAG for the same reason as the verify step above: a ref name
        # interpolated with ${{ }} becomes PowerShell source.
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          @'
          Windows release assets for stt_app:

          - `stt_app-win-x64-setup.exe`
            Recommended for most users. Runs a normal Windows installer and creates Start-menu shortcuts.

          - `stt_app-win-x64-setup.exe.sha256`
            SHA-256 checksum used by the in-app updater to verify the installer download.

          - `stt_app-win-x64.zip`
            Portable bundle. Extract it anywhere and run `stt_app.exe` from the extracted folder.

          - `Source code (zip/tar.gz)`
            GitHub adds these archives automatically. They contain the repository
            source for developers, not the built Windows app.
          '@ | Set-Content -Encoding UTF8 $notesPath

          # This block has control flow, so it cannot be one command per step
          # and every gh call is checked by hand instead. Without that, a
          # failed `gh release edit` was masked by the upload after it and the
          # release shipped with whatever notes it already had.
          function Assert-LastExitCode($what) {
              if ($LASTEXITCODE -ne 0) {
                  Write-Error "$what failed with exit code $LASTEXITCODE"
                  exit $LASTEXITCODE
              }
          }

          # This one is allowed to fail: its exit code chooses the branch.
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
              gh release edit $tag --notes-file $notesPath
              Assert-LastExitCode 'gh release edit'
              gh release upload $tag `
                  "release\stt_app-win-x64.zip" `
                  "release\installer\stt_app-win-x64-setup.exe" `
                  "release\installer\stt_app-win-x64-setup.exe.sha256" `
                  --clobber
              Assert-LastExitCode 'gh release upload'
          }
          else {
              gh release create $tag `
                  "release\stt_app-win-x64.zip" `
                  "release\installer\stt_app-win-x64-setup.exe" `
                  "release\installer\stt_app-win-x64-setup.exe.sha256" `
                  --title $tag `
                  --notes-file $notesPath
              Assert-LastExitCode 'gh release create'
          }
