---
name: Quality

on:
  push:
    branches:
      - main
      - "review/**"
    # Tags too. The release workflow runs its own gate under the offscreen
    # Qt platform, where the pixel-exact layout assertions skip themselves,
    # so without this a `git tag && git push --tags` reached production
    # with those assertions never executed anywhere in CI.
    tags:
      - "v*"
  pull_request:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: windows-latest
    timeout-minutes: 30
    # No QT_QPA_PLATFORM here on purpose. Under `offscreen` Qt reports widget
    # metrics 1-4 px off, which fails the pixel-exact layout tests for reasons
    # that have nothing to do with the code (see AGENTS.md, "Tests"). The
    # windows-latest runner has a real platform plugin; use it.

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --group dev --locked

      - name: Check formatting and static rules
        run: uv run --no-sync ruff check .

      - name: Run test suite
        # No -q here: pyproject already sets addopts = "-q", and a
        # second one is -qq, which suppresses the final "N passed" line
        # entirely -- a run that collected three tests then looks exactly
        # like one that collected the whole suite.
        run: uv run --no-sync pytest

  javascript-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Audit locked production dependencies
        run: npm audit --omit=dev --package-lock-only --audit-level=high
