---
name: Quality

on:
  push:
    branches:
      - main
      - "review/**"
    # Tags too, so a tagged commit has this gate's own result beside the
    # release workflow's. Since 2026-09-18 that workflow runs the same test
    # command on the real desktop; before, it ran under the offscreen Qt
    # platform, where the pixel-exact layout assertions skip themselves.
    tags:
      - "v*"
  pull_request:
  # Started by hand from the Actions tab or `gh workflow run quality.yml`:
  # re-runs the gate on a commit without pushing an empty commit to get one,
  # e.g. after a runner-side flake or when the advisory database moved.
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: windows-latest
    timeout-minutes: 30
    # No QT_QPA_PLATFORM here on purpose. Under `offscreen` Qt reports widget
    # metrics 1-4 px off, which fails the pixel-exact layout tests for reasons
    # that have nothing to do with the code (see AGENTS.md, "Tests"). The
    # windows-latest runner has a real platform plugin; use it.

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --group dev --locked

      - name: Check formatting and static rules
        run: uv run --no-sync ruff check .

      - name: Run test suite
        # No -q here: pyproject already sets addopts = "-q", and a
        # second one is -qq, which suppresses the final "N passed" line
        # entirely -- a run that collected three tests then looks exactly
        # like one that collected the whole suite.
        run: uv run --no-sync pytest

  javascript-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Audit locked production dependencies
        # Must match the release job's bar in windows-release.yml.
        # `npm audit` queries the live advisory database, so its
        # verdict moves with no code change: with the release job at
        # `moderate` and this one at `high`, a moderate advisory
        # published between merge and tag failed the release *after*
        # create_release.py had already pushed main and the tag.
        run: npm audit --omit=dev --package-lock-only --audit-level=moderate
