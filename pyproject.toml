[project]
name = "stt-app"
version = "0.9.0"
description = "Local and cloud speech-to-text dictation for Windows 11"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6==6.11.1",
    "sounddevice==0.5.5",
    "numpy==2.5.2",
    "faster-whisper==1.2.1",
    "onnxruntime-genai==0.15.2; platform_system == 'Windows'",
    # Pure-Python NeMo runtime (Parakeet/Canary). Resolves the same
    # onnxruntime distribution onnxruntime-genai already requires; do NOT
    # add onnxruntime-directml, which overwrites it and breaks genai.
    "onnx-asr[cpu,hub]==0.12.0",
    "keyring==25.7.0",
    "pywin32==312; platform_system == 'Windows'",
    "comtypes==1.4.16; platform_system == 'Windows'",
    "assemblyai==0.64.33",
    "groq==1.6.0",
    "truststore==0.10.4",
    "websocket-client==1.9.0",
]

[project.scripts]
stt-app = "stt_app.main:run"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stt_app"]
include = [
    "src/stt_app/webgpu_asr_runner.mjs",
    "src/stt_app/assets/app_icon.ico",
]

[tool.ruff]
target-version = "py312"
# Only feeds the fixers that need a width; E501 is deliberately not selected,
# because reflowing existing code buys nothing and hides real findings in noise.
line-length = 88

[tool.ruff.lint]
# Written out on purpose instead of inheriting ruff's defaults. A default set is
# the vendor's opinion at one version and it moves: an upgrade would otherwise
# either start hiding a finding or turn the gate red on unchanged code without
# anyone having chosen the rule.
select = [
    "E4",   # pycodestyle: import placement
    "E7",   # pycodestyle: statement-level errors
    "E9",   # pycodestyle: syntax/IO errors
    "F",    # pyflakes
    "I",    # import order
    "A",    # shadowed builtins
    "B",    # bugbear: real defect patterns
    "C4",   # comprehension misuse
    "DTZ",  # naive datetime
    "FLY",  # static string joins
    "G",    # logging call misuse
    "ICN",  # import conventions
    "ISC",  # implicit string concatenation
    "LOG",  # logging module misuse
    "PERF", # obvious performance traps
    "PIE",  # miscellaneous lints
    "RET",  # return-path simplification
    "RUF",  # ruff's own checks
    "SIM",  # simplifications
    "T20",  # stray print()
    "UP",   # syntax outdated for the pinned Python
]
ignore = [
    # SIM105: try/except/pass is the deliberate shape for best-effort Win32, Qt
    # and filesystem teardown in this app, and nearly every one of those sites
    # carries a comment naming what may fail. contextlib.suppress finds no
    # defect here; it only moves that comment away from the call it explains.
    "SIM105",
]

[tool.ruff.lint.per-file-ignores]
# Test doubles keep mutable class attributes as recording buffers, and a few
# tests deliberately assert on a broad exception type or a False literal.
"tests/**" = ["B011", "B017", "RUF012"]
# These are command-line tools; their printed output is the interface.
"scripts/**" = ["T20"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pyinstaller==6.22.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-mock==3.15.1",
    "ruff==0.15.8",
]
