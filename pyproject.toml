[project]
name = "stt-app"
version = "0.9.0"
description = "Local and cloud speech-to-text dictation for Windows 11"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6==6.11.1",
    "sounddevice==0.5.5",
    "numpy==2.5.2",
    "faster-whisper==1.2.1",
    "onnxruntime-genai==0.15.2; platform_system == 'Windows'",
    # Pure-Python NeMo runtime (Parakeet/Canary). Resolves the same
    # onnxruntime distribution onnxruntime-genai already requires; do NOT
    # add onnxruntime-directml, which overwrites it and breaks genai.
    "onnx-asr[cpu,hub]==0.12.0",
    "keyring==25.7.0",
    "pywin32==312; platform_system == 'Windows'",
    "comtypes==1.4.16; platform_system == 'Windows'",
    "assemblyai==0.64.33",
    "groq==1.6.0",
    "truststore==0.10.4",
    "websocket-client==1.9.0",
]

[project.scripts]
stt-app = "stt_app.main:run"

[project.optional-dependencies]
dev = [
    "pyinstaller==6.22.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-mock==3.15.1",
    "ruff==0.15.8",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stt_app"]
include = [
    "src/stt_app/webgpu_asr_runner.mjs",
    "src/stt_app/assets/app_icon.ico",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pyinstaller==6.22.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-mock==3.15.1",
    "ruff==0.15.8",
]
